<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAAS Degree Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #fbfcfa;
    --ink: #16201b;
    --ink-2: #4d5a53;
    --ink-3: #6f7b74;
    --line: #dfe5e0;
    --line-2: #eaeeea;
    --accent: #0d5c33;
    --done: #0d5c33;
    --ip: #2f8f5b;
    --plan: #74bd95;
    --gap-ink: #c2372f;
    --gap-bg: #fbeceb;
    --warn: #8a5300;
    --warn-bg: #fdf1dc;
    --info: #37546f;
    --info-bg: #e8eef4;
    --good-bg: #e2f1e8;
    --chip-bg: #edf1ee;
    --focus: #1d6fd1;
    --shadow: 0 1px 2px rgba(18, 38, 28, 0.06);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1411;
      --surface: #141a17;
      --ink: #e8efe9;
      --ink-2: #b3c0b8;
      --ink-3: #8a978f;
      --line: #28332d;
      --line-2: #1f2823;
      --accent: #8fd6ae;
      --done: #8fd6ae;
      --ip: #3fa06c;
      --plan: #1f5c3d;
      --gap-ink: #f08a82;
      --gap-bg: #3a1d1b;
      --warn: #f2b85c;
      --warn-bg: #33270f;
      --info: #9cbcdb;
      --info-bg: #1b2631;
      --good-bg: #173324;
      --chip-bg: #1c2520;
      --focus: #7fb3ff;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1411;
    --surface: #141a17;
    --ink: #e8efe9;
    --ink-2: #b3c0b8;
    --ink-3: #8a978f;
    --line: #28332d;
    --line-2: #1f2823;
    --accent: #8fd6ae;
    --done: #8fd6ae;
    --ip: #3fa06c;
    --plan: #1f5c3d;
    --gap-ink: #f08a82;
    --gap-bg: #3a1d1b;
    --warn: #f2b85c;
    --warn-bg: #33270f;
    --info: #9cbcdb;
    --info-bg: #1b2631;
    --good-bg: #173324;
    --chip-bg: #1c2520;
    --focus: #7fb3ff;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 var(--sans);
    padding-inline: 16px;
    padding-block: 28px 56px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
  .wrap > *, .req-grid > *, .req > * { min-width: 0; }
  h1, h2, h3 { font-family: var(--cond); text-wrap: balance; margin: 0; }
  h2 { font-size: 20px; font-weight: 600; }
  .eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .code { font: 500 13px/1.3 var(--mono); }
  a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  /* Header */
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  header h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 700; line-height: 1.05; }
  header .sub { color: var(--ink-2); margin-top: 6px; }
  .sync { font: 400 12px/1.4 var(--mono); color: var(--ink-3); text-align: right; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; box-shadow: var(--shadow); }
  .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  .section-head p { margin: 0; color: var(--ink-2); font-size: 14px; }

  /* Hero */
  .hero { display: grid; gap: 20px; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .hero-num { font: 600 56px/1 var(--sans); letter-spacing: -0.02em; }
  .hero-of { font-size: 18px; color: var(--ink-2); }
  .hero-pct { margin-left: auto; font: 500 14px/1 var(--mono); color: var(--ink-2); }
  .track { position: relative; height: 22px; display: flex; gap: 2px; }
  .seg { height: 100%; min-width: 0; border-radius: 0; cursor: default; }
  .seg:first-child { border-radius: 4px 0 0 4px; }
  .seg:last-child { border-radius: 0 4px 4px 0; }
  .seg.done { background: var(--done); }
  .seg.ip { background: var(--ip); }
  .seg.plan { background: var(--plan); }
  .seg.gap { background: repeating-linear-gradient(135deg, var(--gap-ink) 0 2px, transparent 2px 7px); border: 1px solid var(--gap-ink); }
  .seg:hover { filter: brightness(1.08); }
  .ticks { position: relative; height: 18px; font: 400 11px/1 var(--mono); color: var(--ink-3); }
  .ticks span { position: absolute; top: 4px; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
  .legend .num { color: var(--ink); font-weight: 600; margin-left: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; align-content: start; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font: 600 26px/1.15 var(--sans); }
  .tile .note { font-size: 12.5px; color: var(--ink-3); }
  .pace { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
  .pace select, .pace input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .pace label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

  /* Requirements */
  .req-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .req-group h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .req-group h3 .num { font: 500 13px/1.4 var(--mono); color: var(--ink-3); }
  .req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line-2); }
  .req:first-of-type { border-top: 0; }
  .req-name { font-weight: 500; font-size: 14px; }
  .req-hours { font: 500 13px/1.5 var(--mono); color: var(--ink-2); text-align: right; }
  .req .meter { grid-column: 1 / -1; display: flex; gap: 2px; height: 8px; }
  .req .meter .seg:first-child { border-radius: 3px 0 0 3px; }
  .req .meter .seg:last-child { border-radius: 0 3px 3px 0; }
  .req .meter .seg.empty { background: var(--line-2); }
  .req-courses { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .course-chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--mono); padding: 4px 8px 4px 6px; border-radius: 5px; background: var(--chip-bg); color: var(--ink-2); text-decoration: none; }
  .course-chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .course-chip:hover { color: var(--ink); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--sans); letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
  .pill.done { background: var(--good-bg); color: var(--accent); }
  .pill.in-progress { background: var(--good-bg); color: var(--ink-2); }
  .pill.planned { background: var(--chip-bg); color: var(--ink-2); }
  .pill.gap { background: var(--gap-bg); color: var(--gap-ink); }

  /* History chart */
  .history { position: relative; }
  .history svg { display: block; width: 100%; height: auto; overflow: visible; }
  .history .axis text { fill: var(--ink-3); font: 400 11px var(--mono); }
  .history .grid line { stroke: var(--line); stroke-width: 1; }
  .history .bar { cursor: default; }
  .history .era { fill: var(--ink-3); font: 500 11px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; }
  .history .divider { stroke: var(--line); stroke-width: 1; }
  .scroll-x { overflow-x: auto; }
  details { margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  td.hours, th.hours { text-align: right; }
  td .muted { color: var(--ink-3); font-size: 12.5px; }
  tbody tr:hover { background: var(--line-2); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter { font: 500 13px/1 var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .filter[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  /* Checks */
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .check .tag { font: 600 10.5px/1 var(--sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; margin-top: 2px; }
  .check.critical { background: var(--gap-bg); }
  .check.critical .tag { color: var(--gap-ink); border: 1px solid currentColor; }
  .check.warn { background: var(--warn-bg); }
  .check.warn .tag { color: var(--warn); border: 1px solid currentColor; }
  .check.info { background: var(--info-bg); }
  .check.info .tag { color: var(--info); border: 1px solid currentColor; }

  .tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; max-width: 260px; }
  footer { color: var(--ink-3); font-size: 12.5px; }

  @media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .req-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .panel { padding: 16px; }
    .hero-num { font-size: 48px; }
    .hero-pct { margin-left: 0; width: 100%; }
    .tiles { grid-template-columns: minmax(0, 1fr); }
    .sync { text-align: left; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .seg { transition: filter 0.15s; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <div class="eyebrow" id="school"></div>
      <h1 id="degree"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="sync" id="sync"></div>
  </header>

  <section class="panel hero" aria-labelledby="progress-h">
    <div>
      <div class="eyebrow" id="progress-h">Semester credit hours toward the degree</div>
      <div class="hero-top">
        <span class="hero-num num" id="hero-num"></span>
        <span class="hero-of" id="hero-of"></span>
        <span class="hero-pct" id="hero-pct"></span>
      </div>
    </div>
    <div>
      <div class="track" id="track" role="img"></div>
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="panel" aria-labelledby="req-h">
    <div class="section-head">
      <h2 id="req-h">Requirements</h2>
      <p>Each bar is scaled to the hours that block needs.</p>
    </div>
    <div class="req-grid" id="req-grid"></div>
  </section>

  <section class="panel" aria-labelledby="hist-h">
    <div class="section-head">
      <h2 id="hist-h">Credit history</h2>
      <p>Hours that count toward the degree, by when you earned them.</p>
    </div>
    <div class="history scroll-x" id="history"></div>
    <details>
      <summary>Show as table</summary>
      <div class="scroll-x"><table id="history-table"></table></div>
    </details>
  </section>

  <section class="panel" aria-labelledby="todo-h">
    <div class="section-head">
      <h2 id="todo-h">Still to take</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by requirement group"></div>
    </div>
    <div class="scroll-x"><table id="todo"></table></div>
  </section>

  <section class="panel" aria-labelledby="checks-h">
    <div class="section-head">
      <h2 id="checks-h">Things to check</h2>
      <p>Gaps in the plan and cleanup for the Notion database.</p>
    </div>
    <ul class="checks" id="checks"></ul>
    <details>
      <summary id="excluded-summary"></summary>
      <div class="scroll-x"><table id="excluded"></table></div>
    </details>
  </section>

  <footer id="footer"></footer>
</div>
<div class="tooltip" id="tooltip" hidden></div>

<script src="data/courses.js"></script>
<script src="src/requirements.js"></script>
<script src="src/degree-model.js"></script>
<script src="src/dashboard.js"></script>
</body>
</html>
